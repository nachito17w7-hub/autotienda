async function nextNum(type){
  const ref=db.collection("inventario").doc("contadores");
  const snap=await ref.get();
  const d=snap.exists?snap.data():{boleta:0,factura:0};
  const n=(d[type]||0)+1;
  await ref.set({...d,[type]:n});
  return n;
}

function BillingModal({cart,total,onConfirm,onSkip,onClose}){
  const [type,setType]=useState(null);
  const [nombre,setNombre]=useState("");
  const [dni,setDni]=useState("");
  const [razon,setRazon]=useState("");
  const [ruc,setRuc]=useState("");
  const [err,setErr]=useState({});
  const val=()=>{
    const e={};
    if(type==="factura"){if(!razon.trim())e.razon="Requerido";if(!ruc.trim()||ruc.length!==11)e.ruc="RUC: 11 dígitos";}
    setErr(e);return !Object.keys(e).length;
  };
  const confirm=()=>{
    if(!val()) return;
    onConfirm({type,cliente:type==="boleta"?{nombre:nombre||"Sin nombre",dni:dni||"—"}:{razon,ruc}});
  };
  if(!type) return <Sheet title="Comprobante de pago" onClose={onClose}>
    <div style={{fontSize:14,color:C.muted,marginBottom:20}}>¿Qué tipo de comprobante necesita el cliente?</div>
    <div style={{display:"grid",gap:12,marginBottom:16}}>
      <button onClick={()=>setType("boleta")} style={{background:C.card2,border:`2px solid ${C.orange}`,borderRadius:16,padding:"20px",cursor:"pointer",textAlign:"left"}}>
        <div style={{fontSize:24,marginBottom:6}}>🧾</div>
        <div style={{fontSize:16,fontWeight:700,color:C.white,marginBottom:4}}>Boleta de venta</div>
        <div style={{fontSize:12,color:C.muted}}>Para personas — Nombre y DNI (opcionales)</div>
      </button>
      <button onClick={()=>setType("factura")} style={{background:C.card2,border:`2px solid ${C.border}`,borderRadius:16,padding:"20px",cursor:"pointer",textAlign:"left"}}>
        <div style={{fontSize:24,marginBottom:6}}>📄</div>
        <div style={{fontSize:16,fontWeight:700,color:C.white,marginBottom:4}}>Factura</div>
        <div style={{fontSize:12,color:C.muted}}>Para empresas — RUC y Razón Social (requeridos)</div>
      </button>
    </div>
    <button onClick={onSkip} style={{...mbtn("none",C.muted,{border:`1px solid ${C.border}`})}}>Continuar sin comprobante</button>
  </Sheet>;
  return <Sheet title={type==="boleta"?"Datos para boleta":"Datos para factura"} onClose={onClose} full>
    <div style={{marginBottom:16,padding:"12px 14px",background:type==="boleta"?`${C.orange}10`:`${C.blue}10`,border:`1px solid ${type==="boleta"?C.orange:C.blue}30`,borderRadius:10}}>
      <div style={{fontSize:12,color:type==="boleta"?C.orange:C.blue,fontWeight:700}}>{type==="boleta"?"🧾 BOLETA DE VENTA":"📄 FACTURA"}</div>
      <div style={{fontSize:13,color:C.muted,marginTop:2}}>Total: <span style={{color:C.yellow,fontWeight:700}}>{fp(total)}</span></div>
    </div>
    {type==="boleta"&&<>
      <div style={{marginBottom:14}}><label style={mlbl}>Nombre del cliente</label><input style={minp} value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Opcional"/></div>
      <div style={{marginBottom:20}}><label style={mlbl}>DNI</label><input style={minp} type="number" value={dni} onChange={e=>setDni(e.target.value)} placeholder="Opcional"/></div>
    </>}
    {type==="factura"&&<>
      <div style={{marginBottom:14}}><label style={mlbl}>Razón Social *</label><input style={minp} value={razon} onChange={e=>setRazon(e.target.value)} placeholder="Empresa S.A.C."/>{err.razon&&<div style={{color:C.red,fontSize:12,marginTop:4}}>{err.razon}</div>}</div>
      <div style={{marginBottom:20}}><label style={mlbl}>RUC *</label><input style={minp} type="number" value={ruc} onChange={e=>setRuc(e.target.value)} placeholder="20XXXXXXXXX"/>{err.ruc&&<div style={{color:C.red,fontSize:12,marginTop:4}}>{err.ruc}</div>}</div>
    </>}
    <button onClick={confirm} style={mbtn(type==="boleta"?C.orange:C.blue,type==="boleta"?"#000":"#fff")}>Generar {type==="boleta"?"boleta":"factura"}</button>
    <button onClick={()=>setType(null)} style={{...mbtn("none",C.muted,{marginTop:10,border:`1px solid ${C.border}`})}}>← Volver</button>
  </Sheet>;
}

function InvoiceView({invoice,onClose}){
  const sub=invoice.total/(1+IGV);
  const igvAmt=invoice.total-sub;
  const isBol=invoice.type==="boleta";
  const printPDF=()=>{
    const cli=isBol
      ?`<div><b>Cliente:</b> ${invoice.cliente.nombre}</div>${invoice.cliente.dni!=="—"?`<div><b>DNI:</b> ${invoice.cliente.dni}</div>`:""}`
      :`<div><b>Razón Social:</b> ${invoice.cliente.razon}</div><div><b>RUC:</b> ${invoice.cliente.ruc}</div>`;
    const rows=invoice.items.map(i=>`<tr><td>${i.name}</td><td style="text-align:right">${i.qty}</td><td style="text-align:right">S/${i.price.toFixed(2)}</td><td style="text-align:right">S/${(i.price*i.qty).toFixed(2)}</td></tr>`).join("");
    const h=`<!DOCTYPE html><html><head><meta charset="UTF-8"/><style>
      body{font-family:Arial,sans-serif;max-width:380px;margin:20px auto;font-size:13px;color:#000;}
      .hdr{text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:10px;}
      .hdr h2{margin:0;font-size:18px;}.hdr p{margin:2px 0;font-size:11px;color:#555;}
      .doc{text-align:center;border:2px solid #000;padding:8px;margin:10px 0;font-weight:bold;font-size:15px;}
      table{width:100%;border-collapse:collapse;margin:10px 0;}
      th{background:#f0f0f0;padding:5px;border:1px solid #ccc;font-size:11px;text-align:left;}
      td{padding:5px;border:1px solid #eee;font-size:11px;}
      .tot{margin-top:8px;}.tr{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;}
      .tf{font-weight:bold;font-size:15px;border-top:2px solid #000;padding-top:5px;margin-top:3px;}
      .ft{text-align:center;margin-top:12px;font-size:10px;color:#777;border-top:1px solid #ccc;padding-top:8px;}
    </style></head><body>
    <div class="hdr"><h2>AUTOREPUESTOS</h2><p>RUC: 20XXXXXXXXXX</p><p>Juliaca, Puno</p></div>
    <div class="doc">${isBol?"BOLETA DE VENTA":"FACTURA"}<br/>${invoice.numero}</div>
    <div style="font-size:12px;margin:8px 0;"><div><b>Fecha:</b> ${fdL(invoice.date)}</div>${cli}</div>
    <table><tr><th>Descripción</th><th style="text-align:right">Cant</th><th style="text-align:right">P.Unit</th><th style="text-align:right">Total</th></tr>${rows}</table>
    <div class="tot">
      <div class="tr"><span>Subtotal:</span><span>S/${sub.toFixed(2)}</span></div>
      <div class="tr"><span>IGV 18%:</span><span>S/${igvAmt.toFixed(2)}</span></div>
      <div class="tr tf"><span>TOTAL:</span><span>S/${invoice.total.toFixed(2)}</span></div>
    </div>
    <div class="ft">¡Gracias por su compra!</div>
    </body></html>`;
    const w=window.open("","_blank");w.document.write(h);w.document.close();w.focus();setTimeout(()=>w.print(),500);
  };
  const shareWA=()=>{
    const cli=isBol?`👤 ${invoice.cliente.nombre}${invoice.cliente.dni!=="—"?` | DNI: ${invoice.cliente.dni}`:""}` : `🏢 ${invoice.cliente.razon} | RUC: ${invoice.cliente.ruc}`;
    const lines=[`*${isBol?"BOLETA DE VENTA":"FACTURA"}*`,`*${invoice.numero}*`,`📅 ${fdL(invoice.date)}`,``,cli,``,`*DETALLE:*`,...invoice.items.map(i=>`• ${i.qty}x ${i.name} — S/${(i.price*i.qty).toFixed(2)}`),``,`Subtotal: S/${sub.toFixed(2)}`,`IGV (18%): S/${igvAmt.toFixed(2)}`,`*TOTAL: S/${invoice.total.toFixed(2)}*`,``,`_AutoRepuestos — Juliaca_`];
    window.open(`https://wa.me/?text=${encodeURIComponent(lines.join("\n"))}`,"_blank");
  };
  return <Sheet title="Comprobante generado" onClose={onClose} full>
    <div style={{background:"#fff",borderRadius:14,padding:"18px",marginBottom:16,color:"#000"}}>
      <div style={{textAlign:"center",borderBottom:"2px solid #000",paddingBottom:10,marginBottom:10}}>
        <div style={{fontSize:17,fontWeight:800}}>AUTOREPUESTOS</div>
        <div style={{fontSize:10,color:"#555"}}>RUC: 20XXXXXXXXXX · Juliaca, Puno</div>
      </div>
      <div style={{textAlign:"center",border:"2px solid #000",padding:"7px",marginBottom:10,fontWeight:700,fontSize:13}}>
        {isBol?"BOLETA DE VENTA":"FACTURA"}<br/>
        <span style={{letterSpacing:1,fontSize:12}}>{invoice.numero}</span>
      </div>
      <div style={{fontSize:11,marginBottom:8,color:"#333"}}>
        <div><b>Fecha:</b> {fdL(invoice.date)}</div>
        {isBol?<><div><b>Cliente:</b> {invoice.cliente.nombre}</div>{invoice.cliente.dni!=="—"&&<div><b>DNI:</b> {invoice.cliente.dni}</div>}</>
          :<><div><b>Razón Social:</b> {invoice.cliente.razon}</div><div><b>RUC:</b> {invoice.cliente.ruc}</div></>}
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:10,marginBottom:8}}>
        <thead><tr style={{background:"#f0f0f0"}}>{["Descripción","Cant","Precio","Total"].map(h=><th key={h} style={{padding:"4px 5px",border:"1px solid #ccc",textAlign:h!=="Descripción"?"right":"left"}}>{h}</th>)}</tr></thead>
        <tbody>{invoice.items.map((i,idx)=><tr key={idx}>
          <td style={{padding:"4px 5px",border:"1px solid #eee"}}>{i.name}</td>
          <td style={{padding:"4px 5px",border:"1px solid #eee",textAlign:"right"}}>{i.qty}</td>
          <td style={{padding:"4px 5px",border:"1px solid #eee",textAlign:"right"}}>S/{i.price.toFixed(2)}</td>
          <td style={{padding:"4px 5px",border:"1px solid #eee",textAlign:"right"}}>S/{(i.price*i.qty).toFixed(2)}</td>
        </tr>)}</tbody>
      </table>
      <div style={{fontSize:12,color:"#333"}}>
        <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}><span>Subtotal:</span><span>S/{sub.toFixed(2)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}><span>IGV (18%):</span><span>S/{igvAmt.toFixed(2)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0 0",borderTop:"2px solid #000",fontWeight:700,fontSize:14}}><span>TOTAL:</span><span>S/{invoice.total.toFixed(2)}</span></div>
      </div>
      <div style={{textAlign:"center",marginTop:10,fontSize:9,color:"#777",borderTop:"1px solid #ccc",paddingTop:6}}>¡Gracias por su compra!</div>
    </div>
    <button onClick={printPDF} style={{...mbtn("#1a1a1a",C.white,{marginBottom:10,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center",gap:8})}}>
      <span style={{fontSize:18}}>📥</span> Descargar / Imprimir PDF
    </button>
    <button onClick={shareWA} style={{...mbtn("#25D366","#fff",{marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center",gap:8})}}>
      <span style={{fontSize:18}}>💬</span> Compartir por WhatsApp
    </button>
    <button onClick={onClose} style={{...mbtn(C.card2,C.muted,{border:`1px solid ${C.border}`})}}>Cerrar</button>
  </Sheet>;
}

function ProductForm({product,onSave,onClose,codes}){
  const empty={code:"",name:"",category:"Motor",brand:"",price:"",stock:"",min:""};
  const [f,setF]=useState(product?{...product}:empty);
  const [e,setE]=useState({});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const val=()=>{const err={};if(!f.code.trim())err.code="Requerido";else if(!product&&codes.includes(f.code.trim().toUpperCase()))err.code="Ya existe";if(!f.name.trim())err.name="Requerido";if(isNaN(f.price)||Number(f.price)<=0)err.price="Inválido";if(isNaN(f.stock)||Number(f.stock)<0)err.stock="Inválido";setE(err);return !Object.keys(err).length;};
  const sub=()=>{if(!val()) return; onSave({...f,code:f.code.toUpperCase(),price:Number(f.price),stock:Number(f.stock),min:Number(f.min||0),id:product?.id});};
  const er=(k)=>e[k]&&<div style={{color:C.red,fontSize:12,marginTop:4}}>{e[k]}</div>;
  return <Sheet title={product?"Editar producto":"Nuevo producto"} onClose={onClose} full>
    <div style={{marginBottom:14}}><label style={mlbl}>Código</label><input style={{...minp,fontFamily:"monospace",textTransform:"uppercase"}} value={f.code} onChange={ev=>set("code",ev.target.value)} placeholder="FIL-001"/>{er("code")}</div>
    <div style={{marginBottom:14}}><label style={mlbl}>Nombre</label><input style={minp} value={f.name} onChange={ev=>set("name",ev.target.value)} placeholder="Filtro de aceite..."/>{er("name")}</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={mlbl}>Marca</label><input style={minp} value={f.brand} onChange={ev=>set("brand",ev.target.value)} placeholder="NGK..."/></div>
      <div><label style={mlbl}>Categoría</label><select style={minp} value={f.category} onChange={ev=>set("category",ev.target.value)}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
      <div><label style={mlbl}>Precio</label><input style={minp} type="number" step="0.01" min="0" value={f.price} onChange={ev=>set("price",ev.target.value)} placeholder="0.00"/>{er("price")}</div>
      <div><label style={mlbl}>Stock</label><input style={minp} type="number" min="0" value={f.stock} onChange={ev=>set("stock",ev.target.value)} placeholder="0"/>{er("stock")}</div>
      <div><label style={mlbl}>Mínimo</label><input style={minp} type="number" min="0" value={f.min} onChange={ev=>set("min",ev.target.value)} placeholder="5"/></div>
    </div>
    <button onClick={sub} style={mbtn(C.orange)}>{product?"Guardar cambios":"Agregar producto"}</button>
    <button onClick={onClose} style={{...mbtn(C.card2,C.muted,{marginTop:10,border:`1px solid ${C.border}`})}}>Cancelar</button>
  </Sheet>;
}

function SaleModal({products,onSale,onClose}){
  const [q,setQ]=useState("");const [cart,setCart]=useState([]);
  const avail=products.filter(p=>p.stock>0&&(!q||p.code.toLowerCase().includes(q.toLowerCase())||p.name.toLowerCase().includes(q.toLowerCase())));
  const add=p=>{setCart(c=>{const ex=c.find(i=>i.pid===p.id);if(ex)return ex.qty<p.stock?c.map(i=>i.pid===p.id?{...i,qty:i.qty+1}:i):c;return[...c,{pid:p.id,code:p.code,name:p.name,price:p.price,qty:1,max:p.stock}];});setQ("");};
  const upd=(pid,d)=>setCart(c=>c.map(i=>{if(i.pid!==pid)return i;const nq=i.qty+d;return nq<1?null:nq>i.max?i:{...i,qty:nq};}).filter(Boolean));
  const rm=pid=>setCart(c=>c.filter(i=>i.pid!==pid));
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  return <Sheet title="Nueva venta" onClose={onClose} full>
    <div style={{position:"relative",marginBottom:16}}>
      <input style={minp} value={q} onChange={ev=>setQ(ev.target.value)} placeholder="🔍 Buscar producto..."/>
      {q&&avail.length>0&&<div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,marginTop:8,overflow:"hidden"}}>
        {avail.slice(0,6).map(p=><div key={p.id} onClick={()=>add(p)} style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
          <div><div style={{fontSize:11,fontFamily:"monospace",color:C.orange}}>{p.code}</div><div style={{fontSize:14,color:C.text}}>{p.name}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:13,color:C.yellow,fontWeight:700}}>{fp(p.price)}</div><div style={{fontSize:11,color:C.muted}}>{p.stock} disp.</div></div>
        </div>)}
      </div>}
    </div>

          </div>
          <button onClick={()=>{setEP(null);setSPF(true);}} style={{...mbtn(`${C.orange}15`,C.orange,{border:`1px solid ${C.orange}40`,marginBottom:12,padding:"12px"})}}>+ Nuevo producto</button>
          {fp2.length===0?<div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:14}}>Sin resultados</div>
            :fp2.map(p=><div key={p.id} onClick={()=>setDT(p)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px",marginBottom:10,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <div style={{flex:1,marginRight:12}}><div style={{fontFamily:"monospace",fontSize:11,color:C.orange}}>{p.code}</div><div style={{fontSize:15,color:C.text,fontWeight:500}}>{p.name}</div><div style={{fontSize:12,color:C.muted}}>{p.brand} · {p.category}</div></div>
                <div style={{textAlign:"right"}}><div style={{fontSize:15,color:C.yellow,fontWeight:700}}>{fp(p.price)}</div><div style={{fontSize:20,fontWeight:800,color:sc(p)}}>{p.stock}</div><div style={{fontSize:10,color:C.muted}}>mín {p.min}</div></div>
              </div>
            </div>)}
        </div>}

        {tab==="sales"&&<div style={{paddingBottom:90}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px",gridColumn:"1/-1"}}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",marginBottom:4}}>Total acumulado</div><div style={{fontSize:28,fontWeight:800,color:C.yellow}}>{fp(sales.reduce((s,v)=>s+v.total,0))}</div></div>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px"}}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",marginBottom:4}}>Hoy</div><div style={{fontSize:22,fontWeight:800,color:C.green}}>{fp(todR)}</div><div style={{fontSize:11,color:C.muted}}>{todS.length} transac.</div></div>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px"}}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",marginBottom:4}}>Total ventas</div><div style={{fontSize:22,fontWeight:800,color:C.white}}>{sales.length}</div></div>
          </div>
          <button onClick={()=>setSSM(true)} style={{...mbtn(C.orange),marginBottom:14}}>+ Nueva venta</button>
          {sales.length===0?<div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:14}}>Sin ventas registradas</div>
            :sales.map((s,i)=><div key={s.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px",marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <div style={{fontSize:11,fontFamily:"monospace",color:C.muted}}>#{(sales.length-i).toString().padStart(3,"0")}</div>
                    {s.comprobante&&<span style={{background:s.comprobante.type==="boleta"?`${C.orange}20`:`${C.blue}20`,color:s.comprobante.type==="boleta"?C.orange:C.blue,fontSize:10,padding:"2px 8px",borderRadius:8,fontWeight:700}}>{s.comprobante.numero}</span>}
                  </div>
                  <div style={{fontSize:12,color:C.muted}}>{fd(s.date)}</div>
                  <div style={{fontSize:12,color:C.text,marginTop:4}}>{s.items.slice(0,2).map(it=>`${it.qty}x ${it.name}`).join(", ")}{s.items.length>2?`... +${s.items.length-2}`:""}</div>
                  {s.comprobante&&<div style={{fontSize:11,color:C.muted,marginTop:2}}>{s.comprobante.type==="boleta"?s.comprobante.cliente.nombre:s.comprobante.cliente.razon}</div>}
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,marginLeft:10}}>
                  <div style={{fontSize:18,fontWeight:800,color:C.yellow,whiteSpace:"nowrap"}}>{fp(s.total)}</div>
                  {s.comprobante&&<button onClick={()=>viewInv(s)} style={{background:`${C.blue}15`,border:`1px solid ${C.blue}30`,borderRadius:8,color:C.blue,cursor:"pointer",fontSize:11,padding:"5px 10px",fontWeight:700,whiteSpace:"nowrap"}}>📄 Ver</button>}
                </div>
              </div>
            </div>)
          }
        </div>}

        {tab==="alerts"&&<div style={{paddingBottom:90}}>
          {low.length===0?<div style={{background:C.card,border:`1px solid ${C.green}30`,borderRadius:14,padding:"48px 24px",textAlign:"center"}}><div style={{fontSize:44,marginBottom:12}}>✓</div><div style={{color:C.green,fontSize:16,fontWeight:700}}>Todo el stock está en niveles normales</div></div>
            :<><div style={{padding:"12px 14px",background:`${C.red}10`,border:`1px solid ${C.red}30`,borderRadius:12,color:C.red,fontSize:13,marginBottom:14}}>⚡ {low.length} producto{low.length!==1?"s":""} {low.length!==1?"requieren":"requiere"} reposición</div>
              {low.map(p=><div key={p.id} onClick={()=>setDT(p)} style={{background:C.card,border:`1px solid ${p.stock===0?C.red+"30":C.yellow+"30"}`,borderRadius:14,padding:"14px",marginBottom:10,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{flex:1}}><div style={{fontFamily:"monospace",fontSize:11,color:C.orange}}>{p.code}</div><div style={{fontSize:15,color:C.text,fontWeight:500}}>{p.name}</div></div>
                <div style={{textAlign:"right",marginLeft:12}}><div style={{fontSize:28,fontWeight:800,color:sc(p)}}>{p.stock}</div><div style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,background:p.stock===0?`${C.red}20`:`${C.yellow}15`,color:p.stock===0?C.red:C.yellow,marginTop:4}}>{p.stock===0?"AGOTADO":"BAJO"}</div></div>
              </div>)}
            </>
          }
        </div>}
      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.card,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {NAV.map(n=>{const active=tab===n.id;return <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,padding:"12px 4px 10px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4,position:"relative"}}>
          <span style={{fontSize:20,opacity:active?1:0.4}}>{n.icon}</span>
          <span style={{fontSize:10,color:active?C.orange:C.muted,fontWeight:active?700:400}}>{n.label}</span>
          {n.badge>0&&<span style={{position:"absolute",top:8,right:"calc(50% - 18px)",background:C.red,color:"#fff",borderRadius:8,fontSize:9,fontWeight:800,padding:"1px 5px",minWidth:16,textAlign:"center"}}>{n.badge}</span>}
        </button>;})}
      </div>
    </div>

    {showSM&&<SaleModal products={prods} onSale={onSaleConfirm} onClose={()=>setSSM(false)}/>}
    {showBill&&pending&&<BillingModal cart={pending.cart} total={pending.total} onConfirm={onBillConfirm} onSkip={onSkipBill} onClose={()=>{setSB(false);setPend(null);}}/>}
    {showInv&&curInv&&<InvoiceView invoice={curInv} onClose={()=>{setSI(false);setCI(null);}}/>}
    {showIM&&<ImportModal products={prods} onApply={applyImport} onClose={()=>setSIM(false)}/>}
    {showPF&&<ProductForm product={editP} onSave={saveProd} onClose={()=>{setSPF(false);setEP(null);}} codes={prods.filter(p=>!editP||p.id!==editP.id).map(p=>p.code)}/>}
    {detail&&!delId&&<ProdDetail product={detail} onClose={()=>setDT(null)} onEdit={()=>{setEP(detail);setSPF(true);setDT(null);}} onDelete={()=>setDI(detail.id)}/>}
    {delId&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:400,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:C.card,borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:480,textAlign:"center"}}>
        <div style={{width:36,height:4,background:C.border,borderRadius:2,margin:"0 auto 20px"}}/>
        <div style={{fontSize:36,marginBottom:12}}>⚠️</div>
        <div style={{color:C.white,fontSize:17,fontWeight:700,marginBottom:8}}>¿Eliminar producto?</div>
        <div style={{color:C.muted,fontSize:14,marginBottom:24}}>Esta acción no se puede deshacer.</div>
        <button onClick={()=>delProd(delId)} style={mbtn(C.red,"#fff")}>Eliminar</button>
        <button onClick={()=>setDI(null)} style={{...mbtn(C.card2,C.muted,{marginTop:10,border:`1px solid ${C.border}`})}}>Cancelar</button>
      </div>
    </div>}
    {toast&&<div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:C.card,border:`1px solid ${C.border}`,color:C.text,fontSize:14,padding:"12px 20px",borderRadius:14,zIndex:500,whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}}>{toast}</div>}
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
